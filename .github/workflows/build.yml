name: Build FloatCalc Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FloatCalc
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build signed release APK
        run: |
          chmod +x FloatCalcbuild.sh
          ./FloatCalcbuild.sh

      - name: Stage APK
        run: |
          mkdir -p output
          DATE=$(date +'%Y%m%d-%H%M')
          cp app/build/outputs/apk/release/app-release.apk \
            "output/FloatCalc-v${{ github.run_number }}-${DATE}-signed.apk"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: floatcalc-v${{ github.run_number }}
          name: "FloatCalc v${{ github.run_number }}"
          files: output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}